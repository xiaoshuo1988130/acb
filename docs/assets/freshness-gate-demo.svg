<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660" role="img" aria-labelledby="title desc">
  <title id="title">ACB freshness gate demo</title>
  <desc id="desc">A terminal-style demo showing a handoff saved, a human edit after handoff, and ACB returning needs_refresh before the receiving agent edits files.</desc>
  <rect width="1080" height="660" rx="12" fill="#0f1419"/>
  <rect x="0" y="0" width="1080" height="46" rx="12" fill="#1b222b"/>
  <circle cx="26" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="23" r="7" fill="#febc2e"/>
  <circle cx="74" cy="23" r="7" fill="#28c840"/>
  <text x="98" y="29" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">acb freshness gate</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="34" y="88" fill="#8b949e">$ acb handoff --from codex --summary "Ready for OpenCode" --git</text>
    <text x="34" y="122" fill="#e6edf3">[acb] saved handoff packet: pkt_20260530120000_gate</text>
    <text x="34" y="154" fill="#7ee787">[acb] captured git snapshot: branch main, HEAD 6f39999</text>

    <line x1="34" y1="190" x2="1046" y2="190" stroke="#30363d" stroke-width="1"/>
    <text x="34" y="230" fill="#d29922"># human edits README.md after the handoff</text>
    <text x="34" y="262" fill="#8b949e">$ git status --short</text>
    <text x="34" y="294" fill="#ffa657"> M README.md</text>

    <line x1="34" y1="330" x2="1046" y2="330" stroke="#30363d" stroke-width="1"/>
    <text x="34" y="370" fill="#8b949e">receiving agent calls MCP: check_latest_handoff_ready</text>
    <text x="34" y="408" fill="#e6edf3">packet: pkt_20260530120000_gate</text>
    <text x="34" y="440" fill="#ffa657">freshness: changed</text>
    <text x="34" y="472" fill="#f85149">readiness: needs_refresh</text>
    <text x="34" y="504" fill="#e6edf3">blocker: workspace changed after this handoff was saved</text>

    <rect x="34" y="538" width="1012" height="88" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="58" y="578" fill="#7ee787">Result: receiving agent stops before editing.</text>
    <text x="58" y="610" fill="#7ee787">It asks the user to refresh the packet.</text>
  </g>
</svg>
