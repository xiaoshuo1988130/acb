<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AgentContextBus visual handoff flow</title>
  <desc id="desc">A visual flow showing a source coding agent saving local context with ACB, ACB storing a packet with git and terminal context, and a receiving agent pulling the packet through MCP, summarizing it, and acknowledging the handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101820"/>
      <stop offset="46%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#151422"/>
    </linearGradient>
    <linearGradient id="packet" x1="0" x2="1">
      <stop offset="0%" stop-color="#23c6a9"/>
      <stop offset="52%" stop-color="#56a6ff"/>
      <stop offset="100%" stop-color="#b478ff"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" x2="1">
      <stop offset="0%" stop-color="#1b2430"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #edf2f7; }
      .small { font: 500 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aeb9c7; }
      .mono { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dce7f3; }
      .mono-dim { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8896a8; }
      .pill { font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow {
        stroke-dasharray: 16 14;
        animation: dash 1.8s linear infinite;
      }
      .pulse {
        transform-origin: center;
        animation: pulse 1.9s ease-in-out infinite;
      }
      .blink {
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -60; }
      }
      @keyframes pulse {
        0%, 100% { opacity: .65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes blink {
        0%, 50%, 100% { opacity: 1; }
        70% { opacity: .28; }
      }
    </style>
  </defs>

  <rect width="1280" height="720" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="92" r="120" fill="#23c6a9" opacity="0.12"/>
  <circle cx="1110" cy="118" r="150" fill="#b478ff" opacity="0.13"/>
  <circle cx="1020" cy="642" r="160" fill="#f6c451" opacity="0.08"/>

  <g transform="translate(70 54)">
    <text x="0" y="0" class="small">AgentContextBus</text>
    <text x="0" y="44" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="800" fill="#ffffff">Handoff context</text>
    <text x="0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="38" font-weight="800" fill="#ffffff">without re-explaining the repo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="68" y="178" width="330" height="354" rx="18" fill="#151d28" stroke="#2b3848"/>
    <rect x="68" y="178" width="330" height="52" rx="18" fill="#202b38"/>
    <circle cx="96" cy="204" r="7" fill="#ff5f57"/>
    <circle cx="120" cy="204" r="7" fill="#febc2e"/>
    <circle cx="144" cy="204" r="7" fill="#28c840"/>
    <text x="170" y="210" class="mono-dim">source agent</text>

    <text x="94" y="272" class="label">Codex / OpenCode</text>
    <text x="94" y="306" class="small">The agent has fresh workspace context.</text>

    <rect x="94" y="340" width="278" height="118" rx="12" fill="url(#terminal)" stroke="#324356"/>
    <text x="116" y="376" class="mono-dim">$ acb handoff --git</text>
    <text x="116" y="406" class="mono-dim">$ acb panic -- npm test</text>
    <text x="116" y="436" class="mono" fill="#7ee787">saved pkt_... + copied</text>

    <rect x="94" y="486" width="96" height="28" rx="14" fill="#163f37"/>
    <text x="114" y="505" class="pill" fill="#78f0d0">git</text>
    <rect x="202" y="486" width="96" height="28" rx="14" fill="#3b2f17"/>
    <text x="222" y="505" class="pill" fill="#ffd166">stdout</text>
    <rect x="310" y="486" width="62" height="28" rx="14" fill="#3b2030"/>
    <text x="330" y="505" class="pill" fill="#ff8fab">exit</text>
  </g>

  <path d="M418 354 C500 354 510 354 588 354" fill="none" stroke="#56a6ff" stroke-width="5" stroke-linecap="round" class="flow"/>
  <circle cx="506" cy="354" r="12" fill="#56a6ff" filter="url(#glow)" class="pulse"/>

  <g filter="url(#shadow)">
    <rect x="586" y="214" width="240" height="282" rx="24" fill="#101722" stroke="#314155"/>
    <rect x="622" y="246" width="168" height="216" rx="18" fill="url(#packet)"/>
    <rect x="640" y="270" width="132" height="18" rx="9" fill="#ffffff" opacity="0.75"/>
    <rect x="640" y="306" width="92" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="640" y="336" width="116" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="640" y="366" width="104" height="14" rx="7" fill="#ffffff" opacity="0.55"/>
    <rect x="640" y="410" width="54" height="28" rx="14" fill="#08111b" opacity="0.5"/>
    <text x="655" y="430" class="pill" fill="#ffffff">ACB</text>
    <text x="614" y="526" class="label">Local packet</text>
    <text x="614" y="558" class="small">Inspect, copy, query, recover.</text>
  </g>

  <path d="M848 354 C926 354 936 354 1018 354" fill="none" stroke="#b478ff" stroke-width="5" stroke-linecap="round" class="flow"/>
  <circle cx="936" cy="354" r="12" fill="#b478ff" filter="url(#glow)" class="pulse"/>

  <g filter="url(#shadow)">
    <rect x="1018" y="178" width="194" height="354" rx="18" fill="#151d28" stroke="#2b3848"/>
    <rect x="1018" y="178" width="194" height="52" rx="18" fill="#202b38"/>
    <text x="1042" y="211" class="mono-dim">receiving agent</text>
    <text x="1042" y="272" class="label">Cline / Roo</text>
    <text x="1042" y="306" class="small">Pulls context through MCP.</text>

    <g transform="translate(1042 338)">
      <rect x="0" y="0" width="146" height="34" rx="17" fill="#1c3552" stroke="#3b82f6"/>
      <text x="18" y="23" class="pill" fill="#93c5fd">check_ready</text>
      <rect x="0" y="52" width="146" height="34" rx="17" fill="#24331f" stroke="#65a30d"/>
      <text x="21" y="75" class="pill" fill="#bef264">read_packet</text>
      <rect x="0" y="104" width="146" height="34" rx="17" fill="#3c2b13" stroke="#f59e0b"/>
      <text x="18" y="127" class="pill" fill="#fcd34d">summarize</text>
      <rect x="0" y="156" width="146" height="34" rx="17" fill="#37203f" stroke="#a855f7"/>
      <text x="33" y="179" class="pill" fill="#d8b4fe">ack</text>
    </g>
  </g>

  <g transform="translate(70 592)">
    <rect x="0" y="0" width="1140" height="72" rx="18" fill="#0f1720" stroke="#2b3848"/>
    <text x="26" y="44" class="mono">$ npx @agentcontextbus/cli@latest verify first-run</text>
    <rect x="774" y="19" width="150" height="34" rx="17" fill="#163f37"/>
    <text x="799" y="42" class="pill" fill="#78f0d0">local-first</text>
    <rect x="940" y="19" width="174" height="34" rx="17" fill="#3b2030"/>
    <text x="962" y="42" class="pill" fill="#ffb4c8">explicit control</text>
    <rect x="1126" y="33" width="8" height="20" rx="4" fill="#dce7f3" class="blink"/>
  </g>
</svg>
